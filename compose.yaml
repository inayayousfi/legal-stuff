name: media-stack

services:
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:12df8b20528d4cd5e9b6e827d40f2886cf78e53e7e9afc750050648c31183793
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-}"
      VPN_TYPE: "${VPN_TYPE:-openvpn}"
      OPENVPN_USER: "${VPN_OPENVPN_USER:-}"
      OPENVPN_PASSWORD: "${VPN_OPENVPN_PASSWORD:-}"
      SERVER_COUNTRIES: "${VPN_SERVER_COUNTRIES:-}"
      OPENVPN_PROTOCOL: udp
      FIREWALL_INPUT_PORTS: "8080,6881,8000,9696"
      TZ: "${TZ}"
    ports:
      - "8080:8080/tcp"
      - "9696:9696/tcp"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - "${CONFIG_DIR}/gluetun:/gluetun"
    networks:
      default:
        aliases:
          - qbittorrent
          - prowlarr

  tailscale-vpn:
    image: tailscale/tailscale:latest@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: tailscale-vpn
    hostname: media-stack-qbittorrent
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TAILSCALE_AUTH_KEY:-}"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--exit-node=${TAILSCALE_EXIT_NODE:-} --exit-node-allow-lan-access=true"
    ports:
      - "8080:8080/tcp"
      - "9696:9696/tcp"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - "${CONFIG_DIR}/tailscale:/var/lib/tailscale"
    networks:
      default:
        aliases:
          - qbittorrent
          - prowlarr

  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${ADMIN_ACCESS_HOST}:3000"
      HOMEPAGE_VAR_HOST: "${ADMIN_ACCESS_HOST}"
      HOMEPAGE_VAR_GLUETUN_API_KEY: "${GLUETUN_API_KEY:-}"
      PUID: "${PUID}"
      PGID: "${PGID}"
    ports:
      - "3000:3000/tcp"
    volumes:
      - "${CONFIG_DIR}/homepage:/app/config"
    depends_on:
      - glances
      - dockerproxy

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  glances:
    image: nicolargo/glances:latest-full@sha256:c47322ae60260f6039302dde576c8250f28e67cea77f5b93a270e6cd90995665
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      GLANCES_OPT: "-w"
      TZ: "${TZ}"
    volumes:
      - "${MEDIA_DIR}:/media:ro"
    security_opt:
      - no-new-privileges:true

  jellyfin:
    image: jellyfin/jellyfin:10@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - "${CONFIG_DIR}/jellyfin:/config"
      - "${CONFIG_DIR}/jellyfin-cache:/cache"
      - "${MEDIA_DIR}:/media:ro"

  seerr:
    image: seerr/seerr:latest@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    container_name: seerr
    user: "${PUID}:${PGID}"
    init: true
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    ports:
      - "5055:5055/tcp"
    volumes:
      - "${CONFIG_DIR}/seerr:/app/config"
    depends_on:
      - jellyfin
      - sonarr
      - radarr

  vpn-country:
    image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    container_name: vpn-country
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    command: ["python", "/app/vpn_country.py"]
    environment:
      GLUETUN_CONTROL_KEY: "${GLUETUN_CONTROL_KEY:-}"
      PYTHONUNBUFFERED: "1"
      TZ: "${TZ}"
    ports:
      - "8090:8090/tcp"
    volumes:
      - "./vpn_country.py:/app/vpn_country.py:ro"
      - "${CONFIG_DIR}/vpn-country:/data"

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:latest@sha256:9ebb534fe30bab98622cb84a8c3acecfd88319b2d540f52ecdec7b9f866374d7
    container_name: qbittorrent
    restart: unless-stopped
    stop_grace_period: 30m
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      QBT_LEGAL_NOTICE: "${QBT_LEGAL_NOTICE}"
      QBT_WEBUI_PORT: "8080"
      QBT_TORRENTING_PORT: "6881"
    network_mode: "service:${VPN_GATEWAY_SERVICE}"
    volumes:
      - "${CONFIG_DIR}/qbittorrent:/config"
      - "${MEDIA_DIR}:/media"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: prowlarr
    restart: unless-stopped
    environment: &linuxserver-environment
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    network_mode: "service:${VPN_GATEWAY_SERVICE}"
    volumes:
      - "${CONFIG_DIR}/prowlarr:/config"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
    container_name: sonarr
    restart: unless-stopped
    environment: *linuxserver-environment
    ports:
      - "8989:8989/tcp"
    volumes:
      - "${CONFIG_DIR}/sonarr:/config"
      - "${MEDIA_DIR}:/media"
    depends_on:
      - qbittorrent
      - prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: radarr
    restart: unless-stopped
    environment: *linuxserver-environment
    ports:
      - "7878:7878/tcp"
    volumes:
      - "${CONFIG_DIR}/radarr:/config"
      - "${MEDIA_DIR}:/media"
    depends_on:
      - qbittorrent
      - prowlarr

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8@sha256:73303ba5ee647b6492fee917d3a781c6e59b6cab08f9dfce9482a950846f564f
    user: "${PUID}:${PGID}"
    environment:
      TZ: "${TZ}"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      RECYCLARR_CONFIG_DIR: /config
      RECYCLARR_DATA_DIR: /data
    volumes:
      - "${CONFIG_DIR}/recyclarr:/config"
      - "${CONFIG_DIR}/recyclarr-data:/data"
    depends_on:
      - sonarr
      - radarr
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: media-stack

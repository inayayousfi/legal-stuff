name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/selfnook-linux-amd64 ./cmd/selfnook
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/selfnook-linux-arm64 ./cmd/selfnook
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/selfnook-windows-amd64.exe ./cmd/selfnook
          cp migrate_from_python.py dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

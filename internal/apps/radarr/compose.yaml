services:
  radarr-app:
    image: lscr.io/linuxserver/radarr:latest@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: selfnook-radarr-app
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      RADARR__SERVER__URLBASE: /radarr
      RADARR__AUTH__METHOD: External
    volumes:
      - "${CONFIG_DIR}/radarr:/config"
      - "${MEDIA_DIR}:/media"
    depends_on:
      - qbittorrent
      - prowlarr

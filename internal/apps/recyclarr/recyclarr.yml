# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        name: 4K Progressive
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 7d366c213e5c23a052b157356fac1921 # HDR10+ Boost
        - trash_id: d776a1ea912a117d66d83b880ff2055d # Reject DV without HDR fallback

radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        name: 4K Progressive
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: DVD
          - name: SDTV

    custom_format_groups:
      add:
        - trash_id: b29413a7487478fe98228ce79e5689e4 # HDR10+ Boost
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # Reject DV without HDR fallback

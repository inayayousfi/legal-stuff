services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8@sha256:73303ba5ee647b6492fee917d3a781c6e59b6cab08f9dfce9482a950846f564f
    user: "${PUID}:${PGID}"
    environment:
      TZ: "${TZ}"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      RECYCLARR_CONFIG_DIR: /config
      RECYCLARR_DATA_DIR: /data
    volumes:
      - "${CONFIG_DIR}/recyclarr:/config"
      - "${CONFIG_DIR}/recyclarr-data:/data"
    depends_on:
      - sonarr-app
      - radarr-app
    security_opt:
      - no-new-privileges:true
